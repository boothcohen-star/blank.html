
<!DOCTYPE html>
<html>
<head>
  <title>Open Browser</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    button {
      padding: 15px 25px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Knoiren Browser</h2>
  <button onclick="openBrowser()">Open in about:blank</button>

  <script>
    function openBrowser() {
      const win = window.open("about:blank", "_blank");

      if (!win) {
        alert("Allow pop-ups and try again.");
        return;
      }

      win.document.title = "Browser";
      win.document.body.style.margin = "0";

      const frame = win.document.createElement("iframe");
      frame.src = "https://ltorl.github.io/knoiren-browser/";
      frame.style.cssText =
        "position:fixed;inset:0;width:100%;height:100%;border:0";
      frame.allow = "fullscreen";
      win.document.body.appendChild(frame);
    }
  </script>
</body>
</html>
